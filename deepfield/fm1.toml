# DEEP FIELD's build settings (fm1-base's tools/build.py: ../build.sh deepfield)
name = "deepfield"             # the build's files: deepfield.fwsc, deepfield-X.Y.fwsc
id_prefix = "FM-1_14"          # package identity (each firmware its own): dev FM-1_1400, releases FM-1_14XXYYZZ
usb_manufacturer = "Deep Field"
usb_product = "DEEP FIELD FM-1"
include = ["engine"]
o2 = ["engine/drone.c", "engine/fx.c"]   # the drone engine and the effects: their own units at -O2
words = "words.tsv"
ble = true                     # Bluetooth MIDI with a computer, phone or tablet (JieLi's stack; --no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI keyboards and controllers too
cpu2 = true                    # the second core renders half the bodies (plat_cpu2_*)
cpu2_fallback = true           # if it misreads or is late: one core until power-off, no restart
usb_audio_in = true            # the master output recordable over USB
usb_audio_out = false
# the site (tools/make_site.py)
tagline = "an ambient drone machine for the FM-1"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
