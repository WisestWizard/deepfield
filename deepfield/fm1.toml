# DEEP FIELD's build settings (fm1-base's tools/build.py: ../build.sh deepfield)
name = "deepfield"             # the build's files: deepfield.fwsc, deepfield-X.Y.fwsc
id_prefix = "FM-1_14"          # package identity (each firmware its own): dev FM-1_1400, releases FM-1_14XXYYZZ
usb_manufacturer = "Deep Field"
usb_product = "DEEP FIELD FM-1"
include = ["engine"]
o2 = ["engine/drone.c", "engine/fx.c"]   # the drone engine and the effects: their own units at -O2
gen = ["tools/gen_wt.py {gen}/df_wt.h"]   # SCAN's wavetables, from Pocket Poly's spectra (flash, 61 KB)
words = "words.tsv"
ble = true                     # Bluetooth MIDI with a computer, phone or tablet (JieLi's stack; --no-ble builds without it)
ble_central = true             # and the FM-1 connects to Bluetooth MIDI keyboards and controllers too
cpu2 = true                    # the second core renders half the bodies (plat_cpu2_*)
cpu2_fallback = true           # if it misreads or is late: one core until power-off, no restart
usb_audio_in = true            # the master output recordable over USB
usb_audio_out = false
# the site (tools/make_site.py) and firmware.json, which the hubs read and a release build requires
# (base/docs/FIRMWARE-JSON.md)
title = "DEEP FIELD"           # the name people know it by; the USB manufacturer is "Deep Field"
tagline = "an ambient drone machine for the FM-1"
licence = "MPL-2.0"
author = "Kyle McCann"
description = "DEEP FIELD turns the M-VAVE FM-1 into an ambient drone machine. Every key starts a voice that swells in, keeps sounding, breathes, drifts, and fades when you let it go, as hard as you struck it; eight play at once across thirteen models, from breathing harmonics to wavetables and FM. Four knobs shape them all at once, a held key sets one apart, GEN moves them to nearby notes, through a chord progression over your scale, or as an arpeggio of a phrase you played, presets morph into each other, and the reverb can freeze and shimmer. MIDI in over USB, Bluetooth and TRS; out over USB and Bluetooth."
tags = ["synth", "ambient", "generative", "fm"]
install = "https://deepfield.fog.baby/install/"
site = "https://deepfield.fog.baby/"
repo = "https://github.com/WisestWizard/deepfield"
screenshot = "docs/img/screen-home.png"   # relative to deepfield/, which the build takes as the repository root
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
